name: Sportsreelz Import API - Production Deploy

on:
  push:
    branches:
      - import-api-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t 000009587073.dkr.ecr.us-west-2.amazonaws.com/sportsreelz-import-api:production .
          docker push 000009587073.dkr.ecr.us-west-2.amazonaws.com/sportsreelz-import-api:production

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy to Production Server via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID_PRODUCTION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 000009587073.dkr.ecr.us-west-2.amazonaws.com && cd /opt/sportsreelz-import-api && docker-compose pull && docker-compose down && docker-compose up -d && sleep 10 && curl -f http://localhost:8000/api/health"]' \
            --timeout-seconds 600 \
            --comment "Deploy sportsreelz-import-api to production" \
            --output text
