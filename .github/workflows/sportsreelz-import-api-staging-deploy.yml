name: Sportsreelz Import API - Staging Deploy

on:
  push:
    branches:
      - import-api-stage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t 000009587073.dkr.ecr.ap-south-1.amazonaws.com/sportsreelz-import-api:staging .

  sonarqube:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-track:
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cyclonedx-bom pip-audit
          pip install -r requirements.txt

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o sbom.json

      - name: Verify SBOM
        run: |
          echo "SBOM file size:"
          ls -la sbom.json
          echo "First 50 lines:"
          head -50 sbom.json

      - name: Upload SBOM to Dependency-Track
        run: |
          BOM_CONTENT=$(base64 -w 0 sbom.json)
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PUT "${{ secrets.DEPENDENCY_TRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"project\": \"${{ secrets.DEPENDENCY_TRACK_PROJECT_UUID }}\", \"bom\": \"$BOM_CONTENT\"}")
          echo "$RESPONSE"

  push:
    runs-on: ubuntu-latest
    needs: dependency-track
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t 000009587073.dkr.ecr.ap-south-1.amazonaws.com/sportsreelz-import-api:staging .
          docker push 000009587073.dkr.ecr.ap-south-1.amazonaws.com/sportsreelz-import-api:staging

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to Staging Server via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID_STAGING }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 000009587073.dkr.ecr.ap-south-1.amazonaws.com && cd /opt/sportsreelz-import-api && docker-compose pull && docker-compose down && docker-compose up -d && sleep 10 && curl -f http://localhost:8000/api/health && docker image prune -af"]' \
            --timeout-seconds 600 \
            --comment "Deploy sportsreelz-import-api staging" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID_STAGING }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID_STAGING }}" \
            --query "[Status, StandardOutputContent, StandardErrorContent]" \
            --output text
